name: diah
description: Diah - Luxury dress rental marketplace for Algeria
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  uuid: ^4.5.1
  cached_network_image: ^3.4.1
  table_calendar: ^3.2.0
  smooth_page_indicator: ^1.2.1
  flutter_animate: ^4.5.2
  collection: ^1.19.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/diah_logo.png
  adaptive_icon_background: "#F8F5FA"
  adaptive_icon_foreground: assets/images/diah_logo.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
